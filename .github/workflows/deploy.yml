name: Build, Test and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: iris-api

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and test API
        run: |
          pip install -r requirements.txt
          python -m app.train_model
          pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/iris-api:${{ github.sha }}

      - name: Copy Compose file to deployment server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.yml"
          target: "~/iris-api"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DH_USER,DH_TOKEN
          script: |
            mkdir -p ~/iris-api
            cd ~/iris-api
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            printf 'DOCKERHUB_USERNAME=%s\n' "$DH_USER" > .env
            docker compose -f compose.yml pull
            docker compose -f compose.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f compose.yml ps
